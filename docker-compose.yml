services:
  bot:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    # Prefer PostgreSQL; mount a writable directory here for SQLite instead.
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "scripts/healthcheck.py"]
      interval: 60s
      timeout: 10s
      retries: 3
